apiVersion: 1

datasources:
  - name: Jarvis Loki
    uid: jarvis-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000

  - name: Jarvis Prometheus
    uid: jarvis-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 30s
