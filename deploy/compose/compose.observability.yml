# Optional private observability overlay. Start it alongside the production
# file as documented in docs/operations/production-runbook.md. Keeping it separate means the
# core deployment never requires observability images or credentials.
services:
  loki:
    image: ${LOKI_IMAGE:?Set LOKI_IMAGE to an approved Grafana Loki image digest.}
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ../observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki:rw
    networks: [observability_net]
    profiles: [observability]
    read_only: true
    tmpfs:
      - /tmp:mode=0700,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3100/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12

  alloy:
    image: ${ALLOY_IMAGE:?Set ALLOY_IMAGE to an approved Grafana Alloy image digest.}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker's json-file logs are read-only input. Set DOCKER_LOG_ROOT for a
      # rootless Linux daemon whose data root differs from the system default.
      - ${DOCKER_LOG_ROOT:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy/data:rw
    networks: [observability_net]
    depends_on:
      loki:
        condition: service_healthy
    profiles: [observability]
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:mode=0700,size=32m
    cap_drop: [ALL]
    # Required to traverse/read the daemon's root-owned log tree and write the
    # collector-owned named volume. No other host path or control API is mounted.
    cap_add: [DAC_OVERRIDE, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      # The minimal Alloy image has no wget/curl. A running container plus a
      # successful config validation provides a dependency-free health signal.
      test: ["CMD", "/bin/alloy", "validate", "/etc/alloy/config.alloy"]
      interval: 10s
      timeout: 3s
      retries: 12

  prometheus:
    image: ${PROMETHEUS_IMAGE:?Set PROMETHEUS_IMAGE to an approved Prometheus image digest.}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus:rw
    networks: [observability_net]
    profiles: [observability]
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9091}:9090"
    read_only: true
    tmpfs:
      - /tmp:mode=0700,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12

  grafana:
    image: ${GRAFANA_IMAGE:?Set GRAFANA_IMAGE to an approved Grafana OSS image digest.}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in the protected environment file.}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the protected environment file.}
      GF_SERVER_HTTP_PORT: "3000"
      GF_LOG_MODE: console
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana:rw
    networks: [observability_net]
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    profiles: [observability]
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    read_only: true
    tmpfs:
      - /tmp:mode=0700,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  observability_net:
    name: jarvis-observability
    driver: bridge
    internal: true

volumes:
  alloy-data:
  grafana-data:
  loki-data:
  prometheus-data:
