# Production overlay; see production.env.example and docs/operations/production-runbook.md.
include:
  - path: ./compose.base.yml

x-hardened-node-service: &hardened-node-service
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:mode=0700,size=64m
  restart: unless-stopped

x-node-build: &node-build
  context: ../..
  dockerfile: deploy/images/node.Dockerfile

x-model-init-build: &model-init-build
  context: ../..
  dockerfile: deploy/images/model-init.Dockerfile

services:
  inference-gateway:
    <<: *hardened-node-service
    build:
      <<: *node-build
      args:
        APP_NAME: inference-gateway
    environment:
      INFERENCE_GATEWAY_PORT: "3050"
      INFERENCE_UPSTREAM_BASE_URL: ${INFERENCE_UPSTREAM_BASE_URL:-http://host.docker.internal:8080/v1}
      INFERENCE_SERVER_API_KEY: ${INFERENCE_SERVER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - model_restricted
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3050/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  brain-db:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the protected environment file.}
    restart: unless-stopped

  brain-control:
    <<: *hardened-node-service
    build:
      <<: *node-build
      args:
        APP_NAME: brain-control
    environment:
      # Separate fields support URI-reserved characters in passwords.
      BRAIN_DATABASE_HOST: brain-db
      BRAIN_DATABASE_PORT: "5432"
      BRAIN_DATABASE_NAME: brain
      BRAIN_DATABASE_USER: brain
      BRAIN_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the protected environment file.}
      BRAIN_CONTROL_PORT: "3000"
      PLATFORM_CATALOG_PATH: /var/lib/jarvis/platform-catalog/platform-catalog.v2.json
      RUNTIME_PROVISIONER_URL: http://runtime-provisioner:3040
      RUNTIME_PROVISIONER_TOKEN: ${RUNTIME_PROVISIONER_TOKEN:?Set a protected internal provisioner token.}
      RUNTIME_CURRENT_PROFILE_PATH: /var/lib/jarvis/runtime-profile/current-runtime.json
      SCHEDULE_DISPLAY_TIMEZONE: ${SCHEDULE_DISPLAY_TIMEZONE:-Europe/Stockholm}
      AGENT_ROOT_CONCURRENCY: ${AGENT_ROOT_CONCURRENCY:-1}
      AGENT_ADMISSION_LEASE_SECONDS: ${AGENT_ADMISSION_LEASE_SECONDS:-90}
      AGENT_ADMISSION_HEARTBEAT_SECONDS: ${AGENT_ADMISSION_HEARTBEAT_SECONDS:-30}
      # Signs short-lived run capabilities and remains control-plane-only.
      RUN_AUTHORIZATION_SECRET: ${RUN_AUTHORIZATION_SECRET:?Set a protected run authorization signing secret.}
      BRAIN_CONTROL_PLUGIN_ADMIN_TOKEN: ${BRAIN_CONTROL_PLUGIN_ADMIN_TOKEN:-}
      BRAIN_CONTROL_WORKER_COLLABORATION_TOKEN: ${BRAIN_CONTROL_WORKER_COLLABORATION_TOKEN:?Set BRAIN_CONTROL_WORKER_COLLABORATION_TOKEN in the protected environment file.}
      SECOND_BRAIN_ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      brain-db:
        condition: service_healthy
      runtime-provisioner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - control_net
    volumes:
      - ${PLATFORM_CATALOG_DIR:?Set the host directory containing platform-catalog.v2.json}:/var/lib/jarvis/platform-catalog:ro
      - ${RUNTIME_PROFILE_DIR:?Set the host directory containing current-runtime.json}:/var/lib/jarvis/runtime-profile:ro

  runtime-provisioner:
    build:
      context: ../..
      dockerfile: deploy/images/runtime-provisioner.Dockerfile
    environment:
      RUNTIME_PROVISIONER_PORT: "3040"
      RUNTIME_PROVISIONER_TOKEN: ${RUNTIME_PROVISIONER_TOKEN:?Set a protected internal provisioner token.}
      RUNTIME_CURRENT_PROFILE_PATH: /var/lib/jarvis/runtime-profile/current-runtime.json
      PLATFORM_CATALOG_PATH: /var/lib/jarvis/platform-catalog/platform-catalog.v2.json
      # Docker resolves bind sources on the host, not inside this container.
      PLATFORM_CATALOG_HOST_PATH: ${PLATFORM_CATALOG_DIR:?Set the host directory containing platform-catalog.v2.json}/platform-catalog.v2.json
      # Resource bundles named by current-runtime.json are bind-mounted from
      # this operator-controlled host directory into dynamic runtimes.
      RUNTIME_PROFILE_HOST_PATH: ${RUNTIME_PROFILE_DIR:?Set the host directory containing current-runtime.json}
      PI_MODEL_PROVIDER_ID: ${PI_MODEL_PROVIDER_ID:?Set provider ID in the protected environment file.}
      PI_MODEL_ID: ${PI_MODEL_ID:?Set model ID in the protected environment file.}
      BRAIN_CONTROL_URL: http://brain-control:3000
      JARVIS_PLUGIN_RUNTIME_CONFIG: ${JARVIS_PLUGIN_RUNTIME_CONFIG:-{}}
      JARVIS_PLUGIN_CREDENTIALS: ${JARVIS_PLUGIN_CREDENTIALS:-{}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${PLATFORM_CATALOG_DIR:?Set the host directory containing platform-catalog.v2.json}:/var/lib/jarvis/platform-catalog:ro
      - ${RUNTIME_PROFILE_DIR:?Set the host directory containing current-runtime.json}:/var/lib/jarvis/runtime-profile:ro
    networks:
      - control_net
      - runtime_restricted
      - runtime_isolated
      - browser_restricted
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3040/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:mode=0700,size=64m
    restart: unless-stopped
    depends_on:
      inference-gateway:
        condition: service_healthy

  matrix-homeserver:
    environment:
      CONTINUWUITY_SERVER_NAME: ${MATRIX_SERVER_NAME:?Set MATRIX_SERVER_NAME in the protected environment file.}
      CONTINUWUITY_WELL_KNOWN__CLIENT: https://${MATRIX_SERVER_NAME:?Set MATRIX_SERVER_NAME in the protected environment file.}
      # Enable only for controlled first-account bootstrap.
      CONTINUWUITY_ALLOW_REGISTRATION: ${CONTINUWUITY_ALLOW_REGISTRATION:-false}
    ports:
      - "127.0.0.1:${MATRIX_HOST_PORT:-8008}:8008"
    restart: unless-stopped

  matrix-gateway:
    <<: *hardened-node-service
    build:
      <<: *node-build
      args:
        APP_NAME: matrix-gateway
    environment:
      BRAIN_CONTROL_URL: http://brain-control:3000
      MATRIX_GATEWAY_PORT: "3020"
      PLATFORM_CATALOG_PATH: /var/lib/jarvis/platform-catalog/platform-catalog.v2.json
      MATRIX_OUTBOUND_POLL_MS: "1000"
      MATRIX_HOMESERVER_URL: http://matrix-homeserver:8008
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:?Set MATRIX_ACCESS_TOKEN after Matrix bootstrap.}
      MATRIX_OWNER_ID: ${MATRIX_OWNER_ID:?Set MATRIX_OWNER_ID after Matrix bootstrap.}
      MATRIX_BRAIN_USER_ID: ${MATRIX_BRAIN_USER_ID:?Set MATRIX_BRAIN_USER_ID after Matrix bootstrap.}
      MATRIX_E2EE_ENABLED: ${MATRIX_E2EE_ENABLED:-true}
      MATRIX_CRYPTO_STORE_PATH: /brain/matrix-crypto
      MATRIX_RECOVERY_KEY: ${MATRIX_RECOVERY_KEY:-}
      MATRIX_EXCHANGE_ROOT: /brain/exchange
      SECOND_BRAIN_ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      brain-control:
        condition: service_healthy
      matrix-homeserver-ready:
        condition: service_completed_successfully
      matrix-exchange-init:
        condition: service_completed_successfully
    networks:
      - control_net
      - matrix_net
    volumes:
      - ${PLATFORM_CATALOG_DIR:?Set the host directory containing platform-catalog.v2.json}:/var/lib/jarvis/platform-catalog:ro
      - matrix-exchange:/brain/exchange:rw
      - matrix-crypto:/brain/matrix-crypto:rw
    # Shared exchange-volume group.
    group_add:
      - "101"

  brain-worker:
    <<: *hardened-node-service
    build:
      <<: *node-build
      args:
        APP_NAME: brain-worker
    environment:
      BRAIN_CONTROL_URL: http://brain-control:3000
      RUNTIME_PROVISIONER_URL: http://runtime-provisioner:3040
      RUNTIME_PROVISIONER_TOKEN: ${RUNTIME_PROVISIONER_TOKEN:?Set a protected internal provisioner token.}
      RUNTIME_CURRENT_PROFILE_PATH: /var/lib/jarvis/runtime-profile/current-runtime.json
      PLATFORM_CATALOG_PATH: /var/lib/jarvis/platform-catalog/platform-catalog.v2.json
      MEDIA_WORKER_URL: http://media-worker:3030
      SCHEDULE_DISPLAY_TIMEZONE: ${SCHEDULE_DISPLAY_TIMEZONE:-Europe/Stockholm}
      # Scheduled jobs need an explicit destination.
      BRAIN_WORKER_JOB_TYPES: process_inbound,run_schedule,progress_notice
      # Longer than the maximum Pi run.
      BRAIN_WORKER_LEASE_MS: "660000"
      BRAIN_CONTROL_WORKER_COLLABORATION_TOKEN: ${BRAIN_CONTROL_WORKER_COLLABORATION_TOKEN:?Set BRAIN_CONTROL_WORKER_COLLABORATION_TOKEN in the protected environment file.}
      SECOND_BRAIN_ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      brain-control:
        condition: service_started
      media-worker:
        condition: service_started
    networks:
      - control_net
    volumes:
      - ${PLATFORM_CATALOG_DIR:?Set the host directory containing platform-catalog.v2.json}:/var/lib/jarvis/platform-catalog:ro
      - ${RUNTIME_PROFILE_DIR:?Set the host directory containing current-runtime.json}:/var/lib/jarvis/runtime-profile:ro

  brain-delegation-worker:
    <<: *hardened-node-service
    build:
      <<: *node-build
      args:
        APP_NAME: brain-worker
    environment:
      BRAIN_CONTROL_URL: http://brain-control:3000
      RUNTIME_PROVISIONER_URL: http://runtime-provisioner:3040
      RUNTIME_PROVISIONER_TOKEN: ${RUNTIME_PROVISIONER_TOKEN:?Set a protected internal provisioner token.}
      RUNTIME_CURRENT_PROFILE_PATH: /var/lib/jarvis/runtime-profile/current-runtime.json
      PLATFORM_CATALOG_PATH: /var/lib/jarvis/platform-catalog/platform-catalog.v2.json
      MEDIA_WORKER_URL: http://media-worker:3030
      SCHEDULE_DISPLAY_TIMEZONE: ${SCHEDULE_DISPLAY_TIMEZONE:-Europe/Stockholm}
      BRAIN_WORKER_ROLE: brain-delegation-worker
      BRAIN_WORKER_JOB_TYPES: run_agent
      BRAIN_WORKER_LEASE_MS: "660000"
      BRAIN_CONTROL_WORKER_COLLABORATION_TOKEN: ${BRAIN_CONTROL_WORKER_COLLABORATION_TOKEN:?Set BRAIN_CONTROL_WORKER_COLLABORATION_TOKEN in the protected environment file.}
      SECOND_BRAIN_ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      brain-control:
        condition: service_started
      media-worker:
        condition: service_started
    networks:
      - control_net
    volumes:
      - ${PLATFORM_CATALOG_DIR:?Set the host directory containing platform-catalog.v2.json}:/var/lib/jarvis/platform-catalog:ro
      - ${RUNTIME_PROFILE_DIR:?Set the host directory containing current-runtime.json}:/var/lib/jarvis/runtime-profile:ro

  scheduler:
    <<: *hardened-node-service
    environment:
      SECOND_BRAIN_ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      brain-control:
        condition: service_started
  matrix-exchange-init:
    build:
      <<: *node-build
      args:
        APP_NAME: matrix-gateway
    user: "0:0"
    command: ["sh", "/app/deploy/scripts/bootstrap/initialize-matrix-exchange.sh"]
    volumes:
      - matrix-exchange:/brain/exchange:rw
    read_only: true
    security_opt: [no-new-privileges:true]
    restart: "no"

  whisper-model-init:
    build:
      <<: *model-init-build
    environment:
      WHISPER_CPP_MODEL_SHA256: ${WHISPER_CPP_MODEL_SHA256:?Set the verified Whisper model checksum.}
      WHISPER_CPP_MODEL_URL: ${WHISPER_CPP_MODEL_URL:-https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-small.bin}
    command: ["sh", "/usr/local/bin/download-whisper-model"]
    volumes:
      - whisper-models:/opt/whisper-models:rw

  media-worker:
    build:
      context: ../..
      dockerfile: deploy/images/media-worker.Dockerfile
      args:
        WHISPER_CPP_REVISION: ${WHISPER_CPP_REVISION:-23ee03506a91ac3d3f0071b40e66a430eebdfa1d}
        PIPER_VERSION: ${PIPER_VERSION:-2023.11.14-2}
    environment:
      MEDIA_WORKER_PORT: "3030"
      SECOND_BRAIN_ENVIRONMENT: production
      MEDIA_STT_PROVIDER: whisper-cpp
      MEDIA_EXCHANGE_ROOT: /brain/exchange
      MEDIA_CACHE_ROOT: /brain/media-cache
      WHISPER_CPP_BINARY: /usr/local/bin/whisper-cli
      WHISPER_CPP_MODEL_PATH: /opt/whisper-models/ggml-small.bin
      WHISPER_CPP_RUNTIME_VERSION: ${WHISPER_CPP_REVISION:-23ee03506a91ac3d3f0071b40e66a430eebdfa1d}
      WHISPER_CPP_MODEL_ID: ${WHISPER_CPP_MODEL_ID:-ggml-small}
      WHISPER_CPP_MODEL_SHA256: ${WHISPER_CPP_MODEL_SHA256:?Set the verified Whisper model checksum.}
      WHISPER_CPP_LANGUAGE: ${WHISPER_CPP_LANGUAGE:-en}
      MEDIA_TTS_PROVIDER: piper
      PIPER_BINARY: /opt/piper/piper
      PIPER_MODEL_PATH: /opt/piper-models/en_US-ljspeech-high.onnx
      PIPER_RUNTIME_VERSION: ${PIPER_VERSION:-2023.11.14-2}
      PIPER_MODEL_ID: en_US-ljspeech-high
      PIPER_MODEL_SHA256: ${PIPER_MODEL_SHA256:-5d4f08ba6a2a48c44592eed3ce56bf85e9de3dd4e20df90541ae68a8310c029a}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - matrix-exchange:/brain/exchange:rw
      - media-cache:/brain/media-cache:rw
      - whisper-models:/opt/whisper-models:ro
      - piper-models:/opt/piper-models:ro
    depends_on:
      piper-model-init:
        condition: service_completed_successfully
      whisper-model-init:
        condition: service_completed_successfully
      matrix-exchange-init:
        condition: service_completed_successfully
    networks:
      - control_net
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777,size=256m
    pids_limit: 128
    cpus: "2.0"
    mem_limit: 2g
    restart: unless-stopped

  retention-worker:
    <<: *hardened-node-service
    environment:
      RETENTION_DRY_RUN: "false"
      SECOND_BRAIN_ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      brain-control:
        condition: service_started
networks:
  control_net:
    name: jarvis-control
    driver: bridge
    internal: true
  # Named network for provisioned workspace runtimes.
  runtime_restricted:
    name: jarvis-restricted
    driver: bridge
    internal: true
  # No-egress network for roles that may contact only reviewed control/model services.
  runtime_isolated:
    name: jarvis-isolated
    driver: bridge
    internal: true
  browser_restricted:
    # Browser needs public web access but remains isolated from runtime and
    # control-plane networks. Constrain further egress at the host firewall.
    name: jarvis-browser-restricted
    driver: bridge
  matrix_net:
    driver: bridge
  # Host model service requires a non-internal bridge.
  model_restricted:
    name: jarvis-model-restricted
    driver: bridge

volumes:
  brain-postgres-data:
  matrix-data:
  matrix-exchange:
  matrix-crypto:
  media-cache:
  whisper-models:
  piper-models:
