include:
  - path: ./compose.base.yml

x-node-build: &node-build
  context: ../..
  dockerfile: deploy/images/node.Dockerfile

services:
  brain-db:
    environment:
      POSTGRES_PASSWORD: brain-dev-password
    ports:
      - "5432:5432"

  brain-control:
    build:
      <<: *node-build
      args:
        APP_NAME: brain-control
    environment:
      DATABASE_URL: postgres://brain:brain-dev-password@brain-db:5432/brain
      BRAIN_CONTROL_PORT: "3000"
      SECOND_BRAIN_ENVIRONMENT: dev
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      brain-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - control_net

  matrix-homeserver:
    image: forgejo.ellis.link/continuwuation/continuwuity@sha256:5cc03961412fb74836a14599cda3bfa17f003df902d9555281fa973976c5243b
    environment:
      CONTINUWUITY_SERVER_NAME: localhost
    ports:
      - "127.0.0.1:8008:8008"

  matrix-gateway:
    build:
      <<: *node-build
      args:
        APP_NAME: matrix-gateway
    environment:
      BRAIN_CONTROL_URL: http://brain-control:3000
      MATRIX_GATEWAY_PORT: "3020"
      MATRIX_OWNER_ID: "@owner:example"
      MATRIX_BRAIN_USER_ID: "@brain:example"
      MATRIX_EXCHANGE_ROOT: /brain/exchange
      SECOND_BRAIN_ENVIRONMENT: dev
    ports:
      - "127.0.0.1:3020:3020"
    depends_on:
      brain-control:
        condition: service_healthy
      matrix-homeserver-ready:
        condition: service_completed_successfully
    networks:
      - control_net
      - matrix_net
    volumes:
      - media-exchange:/brain/exchange:rw

  scheduler:
    environment:
      SECOND_BRAIN_ENVIRONMENT: dev
    depends_on:
      - brain-control
  media-worker:
    build:
      context: ../..
      dockerfile: deploy/images/media-worker.Dockerfile
      args:
        WHISPER_CPP_REVISION: ${WHISPER_CPP_REVISION:-23ee03506a91ac3d3f0071b40e66a430eebdfa1d}
        PIPER_VERSION: ${PIPER_VERSION:-2023.11.14-2}
    environment:
      MEDIA_WORKER_PORT: "3030"
      SECOND_BRAIN_ENVIRONMENT: dev
      MEDIA_TTS_PROVIDER: piper
      PIPER_BINARY: /opt/piper/piper
      PIPER_MODEL_PATH: /opt/piper-models/en_US-ljspeech-high.onnx
      PIPER_RUNTIME_VERSION: ${PIPER_VERSION:-2023.11.14-2}
      PIPER_MODEL_ID: en_US-ljspeech-high
      PIPER_MODEL_SHA256: "5d4f08ba6a2a48c44592eed3ce56bf85e9de3dd4e20df90541ae68a8310c029a"
    depends_on:
      piper-model-init:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=0700
    volumes:
      - media-exchange:/brain/exchange:rw
      - media-cache:/brain/media-cache:rw
      - piper-models:/opt/piper-models:ro
    pids_limit: 128
    cpus: "2.0"
    mem_limit: 2g
    networks:
      - control_net

  retention-worker:
    environment:
      SECOND_BRAIN_ENVIRONMENT: dev
    depends_on:
      - brain-control
networks:
  control_net:
    driver: bridge
  matrix_net:
    driver: bridge
  model_net:
    driver: bridge

volumes:
  brain-postgres-data:
  matrix-data:
  model-cache:
  piper-models:
  media-exchange:
  media-cache:
